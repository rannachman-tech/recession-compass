name: Update recession data

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-recession-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run fetcher (all regions)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run fetch

      - name: Commit if changed
        run: |
          git config user.name "compass-bot"
          git config user.email "compass-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "chore: refresh recession data [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
